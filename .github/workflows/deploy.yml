# Publicação do site.
#
# Existe por causa de um incidente: em 14/07/2026 alguém buildou e publicou a
# partir de uma cópia local que nunca foi commitada. A branch gh-pages ficou com
# um site que não saía de nenhum commit da main, e o código-fonte se perdeu.
# Enquanto publicar for um comando que qualquer máquina roda, isso se repete.
# Aqui, o que vai ao ar sai SEMPRE de um commit da main, e só se passar nos
# testes.
#
# Por que empurrar para gh-pages em vez de usar actions/deploy-pages: o Pages
# deste repositório está em "Deploy from a branch: gh-pages", e trocar para
# "GitHub Actions" exigiria mexer no painel. Este job mantém o arranjo atual —
# faz o que o `gh-pages -d dist` fazia, só que a partir da main e com testes
# na frente.
#
# Por que nenhuma action de terceiro: só actions/checkout e actions/setup-node,
# as duas do próprio GitHub. O passo de publicar é git puro. Um repositório que
# acabou de perder o código-fonte não precisa de mais uma peça de confiança na
# cadeia, ainda por cima uma que recebe token de escrita.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez, e sem cancelar o que já começou: cancelar no meio podia
# deixar a gh-pages com um build pela metade.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # o passo "A suíte mudou?" compara com o commit anterior do push, que
          # pode estar vários commits atrás — clone raso não alcança.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Servir o build no mesmo caminho da produção
        run: |
          mkdir -p .servir/sls-site
          cp -r dist/. .servir/sls-site/
          (cd .servir && nohup python3 -m http.server 8099 --bind 127.0.0.1 > /tmp/http.log 2>&1 &)
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8099/sls-site/; then
              echo "servidor de pé"; exit 0
            fi
            sleep 1
          done
          echo "::error::o servidor local não respondeu em 40s"
          cat /tmp/http.log
          exit 1

      - name: Smoke
        run: node scripts/smoke.mjs

      # Os impostores custam ~11 min dos ~17 do deploy, e só dizem algo quando a
      # SUÍTE muda: eles medem se o smoke sabe reprovar, não se o site está bom.
      # Mudança só de conteúdo (um texto, uma foto, uma cor) não muda a resposta
      # deles — o smoke real, que roda sempre, é quem pega isso.
      #
      # Sem base de comparação (branch nova, force-push, histórico raso) ou em
      # execução manual, RODA. Guardião rodando à toa custa tempo; guardião que
      # não rodou quando devia custa um deploy errado.
      - name: A suíte mudou?
        id: mudou
        run: |
          antes='${{ github.event.before }}'
          zeros='0000000000000000000000000000000000000000'
          if [ "${{ github.event_name }}" != 'push' ]; then
            echo "rodar=sim" >> "$GITHUB_OUTPUT"
            echo "motivo=execução manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$antes" ] || [ "$antes" = "$zeros" ] || ! git cat-file -e "$antes^{commit}" 2>/dev/null; then
            echo "rodar=sim" >> "$GITHUB_OUTPUT"
            echo "motivo=sem base de comparação ($antes)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          arquivos=$(git diff --name-only "$antes" "$GITHUB_SHA")
          echo "arquivos no push:"; echo "$arquivos" | sed 's/^/  /'
          if printf '%s\n' "$arquivos" | grep -qE '^(scripts/|\.github/|package\.json$|package-lock\.json$)'; then
            echo "rodar=sim" >> "$GITHUB_OUTPUT"
            echo "motivo=a suíte ou o ambiente mudaram" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=nao" >> "$GITHUB_OUTPUT"
            echo "motivo=nada de scripts/, .github/ ou package.json no diff" >> "$GITHUB_OUTPUT"
          fi

      - name: Por que os impostores vão (ou não) rodar
        run: echo "rodar=${{ steps.mudou.outputs.rodar }} — ${{ steps.mudou.outputs.motivo }}"

      # A fonte do runner nao renderiza igual a de nenhuma outra maquina, e foi
      # por 2px de diferenca que um deploy caiu. Este passo alarga o tracking dos
      # rotulos em 1px e exige que a suite continue VERDE — robustez, nao
      # impostor. ESTRESSE_PX=12 derruba 11 assercoes, que e como se sabe que o
      # modo esta ligado nelas.
      - name: Os rótulos aguentam fonte mais larga
        run: MODO=estresse node scripts/smoke.mjs

      # Suíte verde não vale nada se ela não souber reprovar. Cada impostor muta
      # o artefato SERVIDO (folha de estilo ou bundle) e tem de derrubar o
      # smoke. Se algum passar verde, o deploy para aqui.
      - name: Os impostores têm de morder
        if: steps.mudou.outputs.rodar == 'sim'
        run: |
          falhou=0
          for m in impostor-css impostor-rede impostor-wa impostor-em \
                   impostor-missao impostor-persona impostor-manifest impostor-logo \
                   impostor-gray impostor-pwa impostor-azos impostor-faixa \
                   impostor-overlay impostor-pilares impostor-grade impostor-ital \
                   impostor-veu impostor-cabecalho impostor-impar impostor-herdada \
                   impostor-dourado; do
            cod=0
            MODO="$m" node scripts/smoke.mjs > "/tmp/$m.log" 2>&1 || cod=$?
            if [ "$cod" -eq 0 ]; then
              echo "::error::o impostor $m passou VERDE — o smoke não discrimina"
              tail -25 "/tmp/$m.log"
              falhou=1
            else
              echo "ok: $m mordeu (exit $cod)"
            fi
          done
          cod=0
          MODO=modo-que-nao-existe node scripts/smoke.mjs > /tmp/desconhecido.log 2>&1 || cod=$?
          if [ "$cod" -ne 3 ]; then
            echo "::error::modo desconhecido devia sair 3 (instrumento), saiu $cod"
            falhou=1
          else
            echo "ok: modo desconhecido saiu 3"
          fi
          exit "$falhou"

      - name: Publicar em gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q \
            -m "deploy a partir de ${GITHUB_SHA}" \
            -m "Gerado por .github/workflows/deploy.yml. NÃO edite esta branch à mão: o próximo deploy sobrescreve tudo. A fonte está na main, no commit ${GITHUB_SHA}."
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          {
            echo "### Publicado"
            echo "gh-pages agora sai de \`${GITHUB_SHA}\`."
            echo "Site: https://vitalgab.github.io/sls-site/"
          } >> "$GITHUB_STEP_SUMMARY"
